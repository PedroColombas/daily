# Runs the demo-path suite against a DEPLOYED build, triggered by Vercel reporting a finished
# deployment rather than by a push. Two reasons:
#
#  - A push is not a deploy. Triggering on push raced the build and tested the previous version.
#  - Every branch gets a Vercel preview, so the suite now runs against the preview BEFORE anything is
#    merged — a change that would break the public demo shows up red on the branch, not live.
#
# Previews sit behind a Vercel login; VERCEL_AUTOMATION_BYPASS_SECRET lets the suite through (see
# e2e/global-setup.ts). Production runs against DEMO_BASE_URL, the public domain.
name: e2e

on:
  deployment_status:
  workflow_dispatch:

jobs:
  demo-path:
    runs-on: ubuntu-latest
    # Vercel posts several statuses per deployment (pending, then success or failure); only a
    # finished, successful one is worth testing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    env:
      DEMO_BASE_URL: >-
        ${{ github.event.deployment.environment == 'Preview'
            && github.event.deployment_status.environment_url
            || secrets.DEMO_BASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: >-
        ${{ github.event.deployment.environment == 'Preview'
            && secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the demo-path suite against ${{ github.event.deployment.environment || 'production' }}
        working-directory: e2e
        run: npm test

      - name: Keep the report on failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          # Playwright only writes a report when something fails, so a green run has nothing to
          # upload. Without this every passing run carries a warning annotation.
          if-no-files-found: ignore
